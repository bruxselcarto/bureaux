        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }

        photonControl._container.childNodes[0].style.borderRadius="10px"
        // Create a variable to store the geoJSON data

            z = typeof e.choice.properties.label === 'undefined'? e.choice.properties.display_name : e.choice.properties.label;
            console.log(e);
            e.target.input.value = z;
        });
        var search = document.getElementsByClassName("leaflet-photon leaflet-control")[0];
        search.classList.add("leaflet-control-search")
        search.style.display = "flex";
        search.style.backgroundColor="rgba(255,255,255,0.5)" 

        // Create the new button element
        var button = document.createElement("div");
        button.id = "gcd-button-control";
        button.className = "gcd-gl-btn fa fa-search search-button";

        // Insert the button at the beginning of the search control
        search.insertBefore(button, search.firstChild);

        button.addEventListener("click", function (e) {

        });
        // Orthophoto récente de la Région bruxelloise (UrbIS, service Paradigm.brussels,
        // WMTS public CC-0). La couche "Ortho" pointe toujours vers le dernier millésime
        // disponible (2024 actuellement). Note : construit à partir du schéma d'URL REST
        // documenté par ce service (bug connu : le segment {style} doit être omis).
        var OrthoBrusselsTileLayer = L.TileLayer.extend({
            getTileUrl: function (coords) {
                return 'https://geoservices-grid.irisnet.be/geowebcache/service/wmts/rest/Ortho/EPSG:900913/EPSG:900913:' + coords.z + '/' + coords.y + '/' + coords.x + '?format=image/png';
            }
        });
        var layer_OrthophotoBrussels = new OrthoBrusselsTileLayer('', {
            attribution: 'Orthophoto UrbIS © urban.brussels / Paradigm.brussels (CC0)',

            maxZoom: 20,
            minNativeZoom: 8,

        });

        var baseTree = [

        map.addLayer(layer_OSMStandard_1);

        var overlaysTree = [
            {label: '<img src="legend/LignesbureauxEPSG4326_4_Ensemblesdebureaux0.png" /> Ensembles de bureaux', layer: layer_LignesbureauxEPSG4326_4},
            {label: 'Parc de bureaux en 2022/2023 et reconversions de bureaux autorisés entre 1997 et 2022', selectAllCheckbox: true, children: [
                {label: 'Superficie de bureaux', selectAllCheckbox: true, children: [
                    {label: '<img src="legend/Cartebureaux2022_2023V2_poly_georef_centroidsEPSG4326_3_Bureauxbleus0.png" /> Stock', layer: layer_Cartebureaux_BureauxBleus},
                    {label: '<img src="legend/Cartebureaux2022_2023V2_poly_georef_centroidsEPSG4326_3_Bureauxroses1.png" /> Vacance commercialisée', layer: layer_Cartebureaux_BureauxRoses},
                ]},
                {label: 'Reconversions 1997-2022', selectAllCheckbox: true, children: [
                    {label: '<img src="legend/Cartebureaux2022_2023V2_poly_georef_centroidsEPSG4326_3_Reconversions19972022Logement6.png" /> Logement', layer: layer_Cartebureaux_ReconvLogement},
                    {label: '<img src="legend/Cartebureaux2022_2023V2_poly_georef_centroidsEPSG4326_3_Reconversions19972022Equipement5.png" /> Equipement', layer: layer_Cartebureaux_ReconvEquipement},
                    {label: '<img src="legend/Cartebureaux2022_2023V2_poly_georef_centroidsEPSG4326_3_Reconversions19972022Commerce4.png" /> Commerce', layer: layer_Cartebureaux_ReconvCommerce},
                    {label: '<img src="legend/Cartebureaux2022_2023V2_poly_georef_centroidsEPSG4326_3_Reconversions19972022Ambassade2.png" /> Ambassade', layer: layer_Cartebureaux_ReconvAmbassade},
                    {label: '<img src="legend/Cartebureaux2022_2023V2_poly_georef_centroidsEPSG4326_3_Reconversions19972022Autre3.png" /> Autre', layer: layer_Cartebureaux_ReconvAutre},
                ]},
            ]},
            {label: '<img src="legend/LimitescommunalesRBC_2.png" /> Limites communales RBC', layer: layer_LimitescommunalesRBC_2},]
        var lay = L.control.layers.tree(null, overlaysTree,{
            //namedToggle: true,
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',
            //openedSymbol: '&#8863; &#x1f5c1;',
            //collapseAll: 'Collapse all',
            //expandAll: 'Expand all',
            collapsed: false, 
        });
        lay.addTo(map);

        // Sélecteur de fonds de carte, ajouté APRÈS le contrôle de couches ci-dessus :
        // comme les deux contrôles partagent la même position, Leaflet les empile dans
        // l'ordre d'ajout, donc celui-ci apparaît en dessous (= "fonds de carte en fin de légende").
        var layBase = L.control.layers.tree(baseTree, null, {
            collapsed: false,
        });
        layBase.addTo(map);

        // --- Légendes à cercles proportionnels (échelle géographique réelle) ---
        // Les cercles sont dessinés en mètres sur le terrain (aire = Superficie),
        // donc leur taille à l'écran change avec le zoom. Ces légendes recalculent
        // leur taille en pixels à chaque changement de zoom/déplacement pour rester
        // synchronisées avec ce qui est réellement affiché sur la carte.

        function metersPerPixelAt(map) {
            var lat = map.getCenter().lat;
            var zoom = map.getZoom();
            return 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, zoom);
        }

        function buildCircleLegendSVG(title, refValues, mpp) {
            var radiiPx = refValues.map(function (v) {
                var radiusMeters = Math.sqrt(v * circleAreaFactor / Math.PI);
                return radiusMeters / mpp;
            });
            var gap = 14;
            var maxR = Math.max.apply(null, radiiPx.concat([2]));
            var svgHeight = maxR * 2 + 22;
            var svgWidth = radiiPx.reduce(function (acc, r) { return acc + Math.max(r, 2) * 2 + gap; }, gap);

            var html = '<div style="font-weight:600;margin-bottom:4px;">' + title + '</div>';
            html += '<svg width="' + svgWidth + '" height="' + svgHeight + '">';
            var xCursor = gap / 2;
            refValues.forEach(function (val, i) {
                var r = Math.max(radiiPx[i], 1);
                var cx = xCursor + r;
                var cy = svgHeight - r - 12;
                html += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="#333" stroke-width="1"/>';
                html += '<text x="' + cx + '" y="' + (svgHeight - 2) + '" font-size="9" text-anchor="middle" fill="#222">' + val.toLocaleString('fr-BE') + '</text>';
                xCursor += r * 2 + gap;
            });
            html += '</svg>';
            return html;
        }

        var legendRefValuesBureaux = [10, 100, 1000];        // m², calibré sur Bureaux bleus/roses
        var legendRefValuesReconv = [100, 1000, 10000];      // m², calibré sur Reconversions (hors valeurs CAD atypiques)

        var legendBureaux = L.control({position: 'bottomleft'});
        legendBureaux.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend-superficie legend-bureaux');
            div.style.background = 'white';
            div.style.padding = '8px 10px';
            div.style.borderRadius = '4px';
            div.style.boxShadow = '0 1px 4px rgba(0,0,0,0.4)';
            div.style.fontSize = '11px';
            div.style.lineHeight = '1.3';
            div.style.marginBottom = '6px';
            L.DomEvent.disableClickPropagation(div);
            return div;
        };
        legendBureaux.addTo(map);

        var legendReconv = L.control({position: 'bottomleft'});
        legendReconv.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend-superficie legend-reconv');
            div.style.background = 'white';
            div.style.padding = '8px 10px';
            div.style.borderRadius = '4px';
            div.style.boxShadow = '0 1px 4px rgba(0,0,0,0.4)';
            div.style.fontSize = '11px';
            div.style.lineHeight = '1.3';
            L.DomEvent.disableClickPropagation(div);
            return div;
        };
        legendReconv.addTo(map);

        function updateProportionalLegends() {
            var mpp = metersPerPixelAt(map);
            var bureauxDiv = document.querySelector('.legend-bureaux');
            var reconvDiv = document.querySelector('.legend-reconv');
            if (bureauxDiv) bureauxDiv.innerHTML = buildCircleLegendSVG('Bureaux — Superficie (m²)', legendRefValuesBureaux, mpp);
            if (reconvDiv) reconvDiv.innerHTML = buildCircleLegendSVG('Reconversions — Superficie (m²)', legendRefValuesReconv, mpp);
        }
        map.on('zoomend moveend', updateProportionalLegends);
        map.whenReady(updateProportionalLegends);

        // --- Curseur de transparence pour les couches "Carte bureaux 2022_2023" ---
        var opacityControl = L.control({position: 'bottomright'});
        opacityControl.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'opacity-control-cartebureaux');
            div.style.background = 'white';
            div.style.padding = '8px 10px';
            div.style.borderRadius = '4px';
            div.style.boxShadow = '0 1px 4px rgba(0,0,0,0.4)';
            div.style.fontSize = '11px';
            div.style.lineHeight = '1.3';
            div.style.width = '170px';
            div.innerHTML =
                '<div style="font-weight:600;margin-bottom:4px;">Transparence — Carte bureaux 2022-2023</div>' +
                '<input type="range" min="0" max="100" value="100" style="width:100%;" id="opacitySliderCartebureaux">';
            L.DomEvent.disableClickPropagation(div);
            L.DomEvent.disableScrollPropagation(div);
            return div;
        };
        opacityControl.addTo(map);

        document.getElementById('opacitySliderCartebureaux').addEventListener('input', function (e) {
            circleOpacity = parseInt(e.target.value, 10) / 100;
            categoryLayers_Cartebureaux.forEach(function (lyr) {
                lyr.eachLayer(function (child) {
                    child.setStyle({fillOpacity: circleOpacity, opacity: circleOpacity});
                });
            });
        });

        // --- Curseur d'échelle des cercles (facteur d'aire, log de 0.001x à 1x = échelle réelle) ---
        var scaleControl = L.control({position: 'bottomright'});
        scaleControl.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'scale-control-cartebureaux');
            div.style.background = 'white';
            div.style.padding = '8px 10px';
            div.style.borderRadius = '4px';
            div.style.boxShadow = '0 1px 4px rgba(0,0,0,0.4)';
            div.style.fontSize = '11px';
            div.style.lineHeight = '1.3';
            div.style.width = '190px';
            div.innerHTML =
                '<div style="font-weight:600;margin-bottom:4px;">Taille des cercles</div>' +
                '<input type="range" min="0" max="100" value="100" style="width:100%;" id="scaleSliderCartebureaux">' +
                '<div id="scaleSliderReadout" style="margin-top:3px;color:#444;">10 000 m² → 10 000 m² (échelle réelle)</div>';
            L.DomEvent.disableClickPropagation(div);
            L.DomEvent.disableScrollPropagation(div);
            return div;
        };
        scaleControl.addTo(map);

        // Régénère complètement les cercles à partir des données sources : plus fiable qu'une
        // simple mutation de rayon (setRadius peut ne pas se répercuter visuellement selon le
        // moteur de rendu). clearLayers() + addData() réapplique filter/pointToLayer/style
        // (donc le circleAreaFactor et circleOpacity courants) sur les mêmes objets de couche,
        // ce qui garde les cases à cocher de la légende valides (même référence d'objet).
        function rebuildCartebureauxCircles() {
            categoryLayers_Cartebureaux.forEach(function (lyr) {
                lyr.clearLayers();
                lyr.addData(json_Cartebureaux2022_2023V2_poly_georef_centroidsEPSG4326_3);
            });
        }

        var scaleRebuildTimeout = null;
        document.getElementById('scaleSliderCartebureaux').addEventListener('input', function (e) {
            var sliderVal = parseInt(e.target.value, 10); // 0 à 100
            // Mapping logarithmique : 0 → facteur 0.001 (cercles ~31x plus petits en rayon), 100 → facteur 1 (échelle réelle)
            circleAreaFactor = Math.pow(10, -3 + (sliderVal / 100) * 3);

            // Retour visuel immédiat (léger) : texte + légende
            updateProportionalLegends();
            var exempleAffiche = Math.round(10000 * circleAreaFactor);
            var readout = document.getElementById('scaleSliderReadout');
            if (readout) {
                readout.textContent = '10 000 m² → ' + exempleAffiche.toLocaleString('fr-BE') + ' m²' + (circleAreaFactor >= 0.999 ? ' (échelle réelle)' : ' affichés');
            }

            // Reconstruction des cercles sur la carte (un peu plus coûteuse) : différée légèrement
            // pour rester fluide pendant qu'on glisse le curseur.
            clearTimeout(scaleRebuildTimeout);
            scaleRebuildTimeout = setTimeout(rebuildCartebureauxCircles, 120);
        });
		document.addEventListener("DOMContentLoaded", function() {
            // set new Layers List height which considers toggle icon
            function newLayersListHeight() {
                var layerScrollbarElement = document.querySelector('.leaflet-control-layers-scrollbar');
                if (layerScrollbarElement) {
                    var layersListElement = document.querySelector('.leaflet-control-layers-list');
                    var originalHeight = layersListElement.style.height 
                        || window.getComputedStyle(layersListElement).height;
                    var newHeight = parseFloat(originalHeight) - 50;
                    layersListElement.style.height = newHeight + 'px';
                }
            }
            var isLayersListExpanded = true;
            var controlLayersElement = document.querySelector('.leaflet-control-layers');
            var toggleLayerControl = document.querySelector('.leaflet-control-layers-toggle');
            // toggle Collapsed/Expanded and apply new Layers List height
            toggleLayerControl.addEventListener('click', function() {
                if (isLayersListExpanded) {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                } else {
                    controlLayersElement.classList.add('leaflet-control-layers-expanded');
                }
                isLayersListExpanded = !isLayersListExpanded;
                newLayersListHeight()
            });	
			// apply new Layers List height if toggle layerstree
			if (controlLayersElement) {
				controlLayersElement.addEventListener('click', function(event) {
					var toggleLayerHeaderPointer = event.target.closest('.leaflet-layerstree-header-pointer span');
					if (toggleLayerHeaderPointer) {
						newLayersListHeight();
					}
				});
			}
            // Collapsed/Expanded at Start to apply new height
            setTimeout(function() {
                toggleLayerControl.click();
            }, 10);
            setTimeout(function() {
                toggleLayerControl.click();
            }, 10);
            // Collapsed touch/small screen
            var isSmallScreen = window.innerWidth < 650;
            if (isSmallScreen) {
                setTimeout(function() {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                    isLayersListExpanded = !isLayersListExpanded;
                }, 500);
            }  
        });       
        setBounds();
